<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Page</title>

    <link rel="icon" type="image/png" href="/img/Logo.png">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        .product-grid a { text-decoration:none; }

        .filter-tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px 0;
        }

        .filter-tag {
            background: #e8e8e8;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
        }

        .search-loading-container {
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            margin-top: 40px;
        }

        .search-not-found-container {
            display: none;
            text-align: center;
            margin-top: 40px;
        }
    </style>
</head>

<body>

<!-- NAV TOP -->
<nav class="nav-top">
    <div class="right-buttons">
        <div class="user-menu">
            <button class="user-btn" id="user-btn">
                <span class="user-text" th:text="${session.username != null} ? ${session.username} : 'Guest'">Guest</span>
                <div class="user-icon"><i class="fa-solid fa-user"></i></div>
            </button>

            <div class="dropdown" id="user-dropdown" th:if="${session.username != null}">
                <i class="fa-solid fa-xmark close" id="close-dropdown"></i>
                <div class="avatar"><i class="fa-solid fa-user"></i></div>
                <h4 th:text="${username}">ชื่อบัญชีผู้ใช้</h4>
                <div class="info">
                    <p><i class="fa-solid fa-envelope"></i> <span th:text="${email}">email</span></p>
                    <p><i class="fa-solid fa-phone"></i> <span th:text="${phone}">phone</span></p>
                </div>
                <button class="logout-btn" id="logout-btn">ออกจากระบบ</button>
            </div>
        </div>

        <a th:href="@{/cart}" class="cart-icon">
            <span class="material-symbols-outlined">shopping_cart</span>
        </a>
    </div>
</nav>

<div class="left-logo">
    <img th:src="@{/img/Logo.png}" alt="TU Store Logo">
</div>

<!-- NAV BOTTOM -->
<nav class="nav-bottom">
    <ul class="menu">
        <li><a th:href="@{/buyerTemp}">หน้าหลัก</a></li>

        <li class="dropdown-category">
            <a href="#" class="dropdown-toggle">หมวดหมู่สินค้า 
                <i class="fa-solid fa-chevron-down"></i>
            </a>

            <div class="overlay"></div>

            <div class="dropdown-content">
                <a href="/product?category=SHIRT">เสื้อ</a>
                <a href="/product?category=BAG">กระเป๋า</a>
                <a href="/product?category=STUDENT_UNIFORM">เครื่องแบบนักศึกษา</a>
                <a href="/product?category=GENERAL_PURPOSE">ของใช้ทั่วไป</a>
                <a href="/product?category=MEMORABILIA">ของที่ระลึก</a>
            </div>
        </li>

        <li><a th:href="@{/order-status-check}">เช็คสถานะ</a></li>
        <li><a href="#">ติดต่อเรา</a></li>

        <li><a href="#" id="search-icon">
            <i class="fa-solid fa-magnifying-glass"></i>
        </a></li>
    </ul>

    <div class="search-bar-replacement">
        <div class="search-input-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="search-input" placeholder="ค้นหาสินค้าที่คุณต้องการ...">
            <div id="search-suggestions" class="suggestions-list"></div>
        </div>

        <button class="search-close-btn" id="search-close">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <button id="filter-icon" class="search-filter-btn">
            <i class="fa-solid fa-filter"></i> ตัวกรอง
        </button>
    </div>
</nav>

<!-- PRODUCT SECTION -->
<div class="product-section">

    <div class="product-header">
        <h1 id="page-title">รายการสินค้าทั้งหมด</h1>
        <p><a href="/product">ดูทั้งหมด</a></p>
    </div>

    <!-- FILTER TAGS -->
    <div id="filter-tags-container" class="filter-tags-container"></div>

    <!-- Loading -->
    <div id="search-loading" class="search-loading-container">
        <div class="loader"></div>
        <p>กำลังดำเนินการ...</p>
    </div>

    <!-- Not found -->
    <div id="search-not-found" class="search-not-found-container">
        <i class="fa-solid fa-circle-xmark"></i>
        <p>ค้นหา: <strong id="search-query-text"></strong></p>
        <h2>ไม่พบสินค้า</h2>
    </div>

    <!-- PRODUCT GRID (JS RENDER ONLY — ไม่มี thymeleaf แล้ว) -->
    <div id="product-grid" class="product-grid"></div>

</div>

<!-- FILTER OVERLAY -->
<div id="filter-overlay" class="overlay-container">
    <div class="modal-content">

        <div class="filter-headbar">
            <h3><i class="fa-solid fa-filter"></i> ตัวกรอง</h3>
            <div class="filter-categories">
                <div class="category-row">
                    <div class="category-label"><span>หมวดหมู่ :</span></div>

                    <div class="category-buttons">
                        <button class="cat-btn" data-category="SHIRT">เสื้อ</button>
                        <button class="cat-btn" data-category="BAG">กระเป๋า</button>
                        <button class="cat-btn" data-category="STUDENT_UNIFORM">เครื่องแบบนักศึกษา</button>
                        <button class="cat-btn" data-category="GENERAL_PURPOSE">ของใช้ทั่วไป</button>
                        <button class="cat-btn" data-category="MEMORABILIA">ของที่ระลึก</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="filter-body">
            

            <!-- PRICE -->
            <div class="filter-section">
                <h4>ช่วงราคา</h4>
                <div class="price-range">
                    <input type="number" id="min-price" class="price-input" placeholder="ใส่ราคาต่ำสุด">
                    <a>-</a>
                    <input type="number" id="max-price" class="price-input" placeholder="ใส่ราคาสูงสุด">
                    <span class="price-unit">บาท</span>
                </div>
                <p id="price-error" class="field-error"></p><!---ข้อความ error -->
            </div>

            <!-- STATUS -->
            <div class="filter-section">
                <h4>สถานะสินค้า</h4>
                <div class="status-buttons">
                    <button class="status-btn" data-status="AVAILABLE">พร้อมจัดส่ง</button>
                    <button class="status-btn" data-status="PRE_ORDER">PRE-ORDER</button>
                </div>
            </div>

            <!-- RATING -->
            <div class="filter-section">
                <h4>คะแนน</h4>
                <div class="rating-buttons">
                    <button class="rating-btn" data-rating="5">5 ⭐</button>
                    <button class="rating-btn" data-rating="4">4 ⭐</button>
                    <button class="rating-btn" data-rating="3">3 ⭐</button>
                    <button class="rating-btn" data-rating="2">2 ⭐</button>
                    <button class="rating-btn" data-rating="1">1 ⭐</button>
                </div>
            </div>

           <div class="filter-button-container">
                <button class="filter-clear-btn" id="filter-clear-button">ล้าง</button>
                <button class="filter-confirm-btn" id="filter-confirm-button">ตกลง</button>
            </div>

        </div>
    </div>
</div>

<!-- JS -->
<script src="/js/main.js" defer></script>
<script src="/js/search.js" defer></script>

<script>
/* SET PAGE TITLE IF /product?category=CODE */
const params = new URLSearchParams(window.location.search);
const cat = params.get("category");
if (cat) {
    const map = {
        SHIRT: "เสื้อ",
        BAG: "กระเป๋า",
        STUDENT_UNIFORM: "เครื่องแบบนักศึกษา",
        GENERAL_PURPOSE: "ของใช้ทั่วไป",
        MEMORABILIA: "ของที่ระลึก"
    };
    document.getElementById("page-title").textContent = map[cat] || "รายการสินค้า";
}
</script>

<script>
document.getElementById("filter-clear-button")?.addEventListener("click", () => {
    document.getElementById("filter-overlay").classList.remove("show");
    window.location.href = "/buyerTemp";   // 🔥 สำหรับหน้า product.html
});
</script>
<!--input validation ฝากย้ายไปไว้ใน search.js ด้วยจ้า-->
<script>
document.addEventListener('DOMContentLoaded', () => {
  const overlay    = document.getElementById('filter-overlay');
  if (!overlay) return;
  const minInput   = overlay.querySelector('#min-price');
  const maxInput   = overlay.querySelector('#max-price');
  const priceError = overlay.querySelector('#price-error');
  const applyBtn   = overlay.querySelector('.filter-confirm-btn');

  function validateFilterInputs(showShake = false) {
    if (!minInput || !maxInput || !applyBtn) return true;

    let minRaw = minInput.value.trim();
    let maxRaw = maxInput.value.trim();

    let min = null;
    let max = null;
    let msg = '';
    let isValid = true;

    const englishPatternGlobal = /[A-Za-z]/g;
    const englishPattern       = /[A-Za-z]/;

    if (minRaw !== '' && englishPattern.test(minRaw)) {
      minRaw = minRaw.replace(englishPatternGlobal, '');
      minInput.value = minRaw;
      isValid = false;
      msg = 'กรุณากรอกราคาต่ำสุดเป็นตัวเลขเท่านั้น';
    }

    if (isValid && maxRaw !== '' && englishPattern.test(maxRaw)) {
      maxRaw = maxRaw.replace(englishPatternGlobal, '');
      maxInput.value = maxRaw;
      isValid = false;
      msg = 'กรุณากรอกราคาสูงสุดเป็นตัวเลขเท่านั้น';
    }

    if (isValid && minRaw !== '') {
      min = Number(minRaw);
      if (Number.isNaN(min)) {
        isValid = false;
        msg = 'กรุณากรอกราคาต่ำสุดเป็นตัวเลขเท่านั้น';
      }
    }

    if (isValid && maxRaw !== '') {
      max = Number(maxRaw);
      if (Number.isNaN(max)) {
        isValid = false;
        msg = 'กรุณากรอกราคาสูงสุดเป็นตัวเลขเท่านั้น';
      }
    }

    if (isValid && ((min !== null && min < 0) || (max !== null && max < 0))) {
      isValid = false;
      msg = 'กรอกราคาติดลบ กรุณากรอกใหม่';
    }

    if (isValid && min !== null && max !== null && min > max) {
      isValid = false;
      msg = 'ราคาต่ำสุดต้องไม่มากกว่าราคาสูงสุด';
    }

    if (priceError) {
      priceError.textContent = msg;  
    }

    if (!isValid) {
      minInput.classList.add('input-error');
      maxInput.classList.add('input-error');
    } else {
      minInput.classList.remove('input-error');
      maxInput.classList.remove('input-error');
    }

    applyBtn.disabled = !isValid;

    if (!isValid && showShake) {
      minInput.classList.add('shake');
      maxInput.classList.add('shake');
      setTimeout(() => {
        minInput.classList.remove('shake');
        maxInput.classList.remove('shake');
      }, 350);
    }

    return isValid;
  }

  minInput?.addEventListener('input', () => validateFilterInputs());
  maxInput?.addEventListener('input', () => validateFilterInputs());
  applyBtn?.addEventListener('click', (e) => {
    const ok = validateFilterInputs(true);
    if (!ok) {
      e.preventDefault();
      return;
    }
  });

  validateFilterInputs();
});
</script>


</body>
</html>
