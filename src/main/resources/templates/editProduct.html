<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>แก้ไขสินค้า | TU Store</title>
    <link rel="icon" type="image/png" href="/img/Logo.png">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/add-product.css}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <!-- ======= Navbar บนสุด ======= -->
<nav class="nav-top">
      <div class="right-buttons">
      <div class="user-menu">
        <button class="user-btn" id="user-btn">
          <span class="user-text" th:text="${session.username != null} ? ${session.username} : 'Guest'">Guest</span>
          <div class="user-icon"><i class="fa-solid fa-user"></i></div>
        </button>


        <div class="dropdown" id="user-dropdown" th:if="${session.username != null}">
          <i class="fa-solid fa-xmark close" id="close-dropdown"></i>
          <div class="avatar"><i class="fa-solid fa-user"></i></div>
          <h4 th:text="${username}">ชื่อบัญชีผู้ใช้</h4>
          <div class="info">
            <p><i class="fa-solid fa-envelope"></i> <span th:text="${email}">username@gmail.com</span></p>
            <p><i class="fa-solid fa-phone"></i> <span th:text="${phone}">xxx-xxx-xxxx</span></p>
          </div>
          <button class="logout-btn" id="logout-btn">ออกจากระบบ</button>
        </div>
      </div>
    </div>
  </nav>
  <div class="left-logo">
          <img th:src="@{/img/Logo.png}" alt="TU Store Logo">
  </div>

  <!-- ======= Navbar ล่าง ======= -->
    <nav class="nav-bottom">
    <ul class="menu">
        <li><a th:href="@{/buyerTemp}">หน้าหลัก</a></li>

        <li class="dropdown-category">
        <a href="#" class="dropdown-toggle">หมวดหมู่สินค้า <i class="fa-solid fa-chevron-down"></i></a>
        <div class="overlay"></div> <!-- สำหรับ liquid glass -->
        <div class="dropdown-content">
              <a th:href="@{'/category/' + 'SHIRT'}">เสื้อ</a>
              <a th:href="@{'/category/' + 'BAG'}">กระเป๋า</a>
              <a th:href="@{'/category/' + 'STUDENT_UNIFORM'}">เครื่องแบบนักศึกษา</a>
              <a th:href="@{'/category/' + 'GENERAL_PURPOSE'}">ของใช้ทั่วไป</a>
              <a th:href="@{'/category/' + 'MEMORABILIA'}">ของที่ระลึก</a>
        </div>
      </li>
      <li><a href="#">เช็คสถานะ</a></li>
      <li><a href="#">ติดต่อเรา</a></li>
      <li><a href="#" id="search-icon"><i class="fa-solid fa-magnifying-glass"></i></a></li>
    </ul> 
    <!-- แถบค้นหาแบบใหม่ (แทนที่เมนู) -->
    <div class="search-bar-replacement">
      <div class="search-input-container">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="search-input" placeholder="ค้นหาสินค้าที่คุณต้องการ...">
      </div>
      <button class="search-close-btn" id="search-close">
        <i class="fa-solid fa-xmark"></i>ตัวกรอง
      </button>
    </div>
    <div id="search-results"></div>
  </nav>

<!-- ======= Popup Logout ======= -->
<div class="logout-modal" id="logout-modal">
<div class="modal-content">
    <i class="fa-solid fa-circle-exclamation"></i>
    <p>คุณต้องการออกจากระบบหรือไม่</p>
    <div class="modal-buttons">
    <button id="cancel-logout" class="cancel-btn">ยกเลิก</button>
    <button id="confirm-logout" class="confirm-btn">ยืนยัน</button>
    </div>
    <i class="fa-solid fa-xmark modal-close" id="close-modal"></i>
</div>
</div>

<div class="logout-success" id="logout-success">
<div class="success-content">
    <i class="fa-solid fa-circle-check"></i>
    <p>ออกจากระบบสำเร็จแล้ว</p>
</div>
  </div>

<!-- ======= Form Edit Product ======= -->
<div class="product-container">

    <!-- Image Section -->
    <div class="product-detail-photo" id="imageArea">
        <img id="editPreviewImage" src="" alt="Preview" style="display:none;">
        <input type="file" id="editImageFile" name="main_image" accept="image/*" style="display:none;">
        <label for="editImageFile" id="editUploadLabel">
            <i class="fa-solid fa-plus"></i><br>เพิ่มรูปภาพสินค้า
        </label>
        <button id="editRemoveImage" style="display:none;">ลบรูป</button>
    </div>

    <!-- Form Section -->
    <div class="product-detail-main">
        <div class="product-header">
            <h1>แก้ไขสินค้า</h1>
            <button id="submitBtn" class="add-to-cart-btn">บันทึกข้อมูลสินค้า</button>
        </div>

        <form id="editForm" enctype="multipart/form-data">
            <!-- สำหรับ PUT method -->
            <input type="hidden" name="_method" value="put">

            <label>ชื่อสินค้า <span style="color:red">*</span></label>
            <input id="editName" name="name" type="text" placeholder="ใส่ชื่อสินค้า" required>

            <label>หมวดหมู่สินค้า <span style="color:red">*</span></label>
            <select id="editCategory" name="category" required>
                <option value="">เลือกหมวดหมู่สินค้า</option>
                <option value="SHIRT">เสื้อ</option>
                <option value="BAG">กระเป๋า</option>
                <option value="STUDENT_UNIFORM">เครื่องแบบนักศึกษา</option>
                <option value="GENERAL_PURPOSE">ของใช้ทั่วไป</option>
                <option value="MEMORABILIA">ของที่ระลึก</option>
            </select>

            <label>จำนวนสินค้าในคลัง <span style="color:red">*</span></label>
            <input id="editStock" name="stock" type="number" min="0" required>

            <label>ราคา <span style="color:red">*</span></label>
            <input id="editPrice" name="price" type="number" min="0" step="0.01" required>

            <label>รายละเอียดสินค้า *</label>
            <textarea id="editDescription" name="description" required></textarea>
        </form>
    </div>
</div>
<script th:src="@{/js/main.js}" defer></script>
<script th:src="@{/js/search.js}" defer></script>
<script th:src="@{/js/edit-product.js}" defer></script>
</body>
</html>
