<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>แก้ไขสินค้า | TU Store</title>
    <link rel="icon" type="image/png" href="/img/Logo.png">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/add-product.css}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <!-- ======= Navbar บนสุด ======= -->
    <nav class="nav-top">
        <div class="right-buttons">
            <div class="user-menu">
                <button class="user-btn" id="user-btn">
                    <span class="user-text"
                        th:text="${session.username != null} ? ${session.username} : 'Guest'">Guest</span>
                    <div class="user-icon"><i class="fa-solid fa-user"></i></div>
                </button>

                <div class="dropdown" id="user-dropdown" th:if="${session.username != null}">
                    <i class="fa-solid fa-xmark close" id="close-dropdown"></i>
                    <div class="avatar"><i class="fa-solid fa-user"></i></div>
                    <h4 th:text="${username}">ชื่อบัญชีผู้ใช้</h4>
                    <div class="info">
                        <p><i class="fa-solid fa-envelope"></i> <span th:text="${email}">username@gmail.com</span></p>
                        <p><i class="fa-solid fa-phone"></i> <span th:text="${phone}">xxx-xxx-xxxx</span></p>
                        <p class="status">
                            <i class="fa-solid"
                                th:classappend="${verifiedStatus == 'อนุมัติการขายแล้ว'} ? 'fa-circle-check text-green' : 'fa-circle-xmark text-red'"></i>
                            <span>สถานะ : </span>
                            <span th:text="${verifiedStatus}"></span>
                        </p>
                    </div>
                    <button class="logout-btn" id="logout-btn">ออกจากระบบ</button>
                </div>
            </div>
        </div>
    </nav>
    <div class="left-logo">
        <img th:src="@{/img/Logo.png}" alt="TU Store Logo">
    </div>

    <!-- ======= Navbar ล่าง ======= -->
    <nav class="nav-bottom">
        <ul class="menu">
            <li><a th:href="@{/sellerTemp}">แดชบอร์ด</a></li>
            <li><a href="#">จัดการสินค้า</a></li>
            <li><a href="#">คำสั่งซื้อ</a></li>
            <li><a href="#">ตั้งค่าร้านค้า</a></li>
            <li><a href="#" id="search-icon"><i class="fa-solid fa-magnifying-glass"></i></a></li>
        </ul>
        <div class="search-bar-replacement">
            <div class="search-input-container">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="ค้นหาสินค้าในร้านของคุณ...">
            </div>
            <button class="search-close-btn" id="search-close"><i class="fa-solid fa-xmark"></i></button>
        </div>
    </nav>

    <!-- ======= Popup ยืนยันออกจากระบบ ======= -->
    <div class="logout-modal" id="logout-modal">
        <div class="modal-content">
            <i class="fa-solid fa-circle-exclamation"></i>
            <p>คุณต้องการออกจากระบบหรือไม่</p>
            <div class="modal-buttons">
                <button id="cancel-logout" class="cancel-btn">ยกเลิก</button>
                <button id="confirm-logout" class="confirm-btn">ยืนยัน</button>
            </div>
            <i class="fa-solid fa-xmark modal-close" id="close-modal"></i>
        </div>
    </div>

    <!-- ======= Popup ออกจากระบบสำเร็จ ======= -->
    <div class="logout-success" id="logout-success">
        <div class="success-content">
            <i class="fa-solid fa-circle-check"></i>
            <p>ออกจากระบบสำเร็จแล้ว</p>
        </div>
    </div>

    <!-- ======= ฟอร์มแก้ไขสินค้า ======= -->
    <div class="product-container">

        <!-- ฝั่งซ้าย: Upload -->
        <div class="product-detail-photo" id="imageArea">
            <label for="imageFile" id="uploadLabel">
                <i class="fa-solid fa-plus"></i><br>
                เปลี่ยนรูปภาพสินค้า
            </label>
            <input type="file" id="imageFile" accept="image/*" style="display:none;">
            <img id="previewImage" src="" alt="Preview">
            <button id="removeImage">ลบรูป</button>
        </div>

        <!-- ฝั่งขวา: Form -->
        <div class="product-detail-main">
            <div class="product-header">
                <h1>แก้ไขสินค้า</h1>
                <button id="submitBtn" class="add-to-cart-btn">บันทึกข้อมูลสินค้า</button>
            </div>

            <form id="editProductForm">
                <input type="hidden" id="productId">
                
                <label>ชื่อสินค้า <span style="color:red">*</span></label>
                <input id="name" type="text" placeholder="ใส่ชื่อสินค้า" required>

                <label>หมวดหมู่สินค้า <span style="color:red">*</span></label>
                <select id="category" required>
                    <option value="">เลือกหมวดหมู่สินค้า</option>
                    <option value="SHIRT">เสื้อ</option>
                    <option value="BAG">กระเป๋า</option>
                    <option value="STUDENT_UNIFORM">เครื่องแบบนักศึกษา</option>
                    <option value="GENERAL_PURPOSE">ของใช้ทั่วไป</option>
                    <option value="MEMORABILIA">ของที่ระลึก</option>
                </select>

                <label>จำนวนสินค้าในคลัง <span style="color:red">*</span></label>
                <input id="stock" type="number" min="0" placeholder="ใส่จำนวนสินค้าในคลัง" required>

                <div class="product-price-box">
                    <div class="price-label">ราคา *</div>
                    <div class="price-value">
                        <input id="price" type="number" min="0" step="0.01" placeholder="ตั้งราคาสินค้า (หน่วย : บาท)" required>
                    </div>
                </div>
            </form>
        </div>

        <!-- ล่าง: รายละเอียด -->
        <div class="product-detail-describe">
            <h3>รายละเอียดสินค้า *</h3>
            <textarea id="description" placeholder="ใส่รายละเอียดสินค้านี้..."></textarea>
        </div>
    </div>

    <script th:src="@{/js/add-product.js}" defer></script>
    <script th:src="@{/js/main.js}" defer></script>
    <script th:src="@{/js/search.js}" defer></script>
    <script>
        const imageInput = document.getElementById('imageFile');
        const previewImage = document.getElementById('previewImage');
        const removeBtn = document.getElementById('removeImage');
        const uploadLabel = document.getElementById('uploadLabel');
        let currentImageUrl = null; // เก็บ URL รูปเดิม
        let imageChanged = false; // ตรวจสอบว่ามีการเปลี่ยนรูปหรือไม่

        // ดึง Product ID จาก URL
        function getProductIdFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id') || window.location.pathname.split('/').pop();
        }

        // โหลดข้อมูลสินค้าเดิม
        async function loadProductData() {
            const productId = getProductIdFromUrl();
            
            if (!productId) {
                alert("❌ ไม่พบรหัสสินค้า");
                window.location.href = "/sellerTemp";
                return;
            }

            document.getElementById('productId').value = productId;

            try {
                const response = await fetch(`/api/products/${productId}`, {
                    method: "GET",
                    credentials: "include"
                });

                if (!response.ok) {
                    throw new Error("ไม่สามารถโหลดข้อมูลสินค้าได้");
                }

                const product = await response.json();

                // เติมข้อมูลในฟอร์ม
                document.getElementById("name").value = product.name || '';
                document.getElementById("category").value = product.category || '';
                document.getElementById("stock").value = product.stock || 0;
                document.getElementById("price").value = product.price || 0;
                document.getElementById("description").value = product.description || '';

                // แสดงรูปภาพเดิม (ถ้ามี)
                if (product.main_image || product.imageUrl) {
                    currentImageUrl = product.main_image || product.imageUrl;
                    previewImage.src = currentImageUrl;
                    previewImage.style.display = 'block';
                    removeBtn.style.display = 'inline-block';
                    uploadLabel.style.display = 'none';
                }

            } catch (error) {
                alert("เกิดข้อผิดพลาดในการโหลดข้อมูล: " + error.message);
                console.error(error);
            }
        }

        // เรียกใช้เมื่อโหลดหน้า
        window.addEventListener('DOMContentLoaded', loadProductData);

        // เมื่อเลือกไฟล์ใหม่
        imageInput.addEventListener('change', function () {
            const file = this.files[0];
            if (file) {
                previewImage.src = URL.createObjectURL(file);
                previewImage.style.display = 'block';
                removeBtn.style.display = 'inline-block';
                uploadLabel.style.display = 'none';
                imageChanged = true; // มีการเปลี่ยนรูป
            }
        });

        // เมื่อกดปุ่มลบรูป
        removeBtn.addEventListener('click', function () {
            previewImage.src = '';
            previewImage.style.display = 'none';
            imageInput.value = '';
            removeBtn.style.display = 'none';
            uploadLabel.style.display = 'flex';
            currentImageUrl = null;
            imageChanged = true;
        });

        // บันทึกการแก้ไข
        document.getElementById("submitBtn").addEventListener("click", async (event) => {
            event.preventDefault();

            const productId = document.getElementById('productId').value;

            if (!productId) {
                alert("❌ ไม่พบรหัสสินค้า");
                return;
            }

            const formData = new FormData();
            formData.append("name", document.getElementById("name").value);
            formData.append("category", document.getElementById("category").value);
            formData.append("price", parseFloat(document.getElementById("price").value));
            formData.append("stock", parseInt(document.getElementById("stock").value));
            formData.append("description", document.getElementById("description").value);

            // ส่งรูปใหม่เฉพาะเมื่อมีการเปลี่ยน
            if (imageChanged && imageInput.files.length > 0) {
                formData.append("main_image", imageInput.files[0]);
            }

            try {
                const response = await fetch(`/api/products/${productId}`, {
                    method: "PUT", // หรือใช้ PATCH ตาม API ของคุณ
                    credentials: "include",
                    body: formData
                });

                if (!response.ok) {
                    const msg = await response.text();
                    alert("❌ แก้ไขสินค้าไม่สำเร็จ: " + msg);
                    return;
                }

                alert("✅ แก้ไขสินค้าเรียบร้อย!");
                window.location.href = "/sellerTemp";
            } catch (error) {
                alert("เกิดข้อผิดพลาด: " + error.message);
                console.error(error);
            }
        });
    </script>
    <script th:src="@{/js/main.js}" defer></script>
    <script th:src="@{/js/auth.js}" defer></script>
    <script th:src="@{/js/sellerTemp.js}" defer></script>
</body>

</html>
