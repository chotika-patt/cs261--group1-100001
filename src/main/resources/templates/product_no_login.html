<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/img/Logo.png">
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <title>Product Page</title>
</head>
<body>
    <!-- ======= Navbar บนสุด ======= -->
    <nav class="nav-top">
        <div class="right-buttons">
            <a th:href="@{/login}" class="btn">เข้าสู่ระบบ / ลงทะเบียน</a>
            <a th:href="@{/login}" class="cart-icon">
                <span class="material-symbols-outlined">shopping_cart</span>
            </a>
        </div>
    </nav>

    <div class="left-logo">
            <img th:src="@{/img/Logo.png}" alt="TU Store Logo">
    </div>

    <nav class="nav-bottom">
            <ul class="menu">
                <li><a th:href="@{/}">หน้าหลัก</a></li>

                <li class="dropdown-category">
                    <a href="#" class="dropdown-toggle">
                        หมวดหมู่สินค้า <i class="fa-solid fa-chevron-down"></i>
                    </a>
                    <div class="dropdown-content">
                        <a th:href="@{'/category/' + 'SHIRT'}">เสื้อ</a>
                        <a th:href="@{'/category/' + 'BAG'}">กระเป๋า</a>
                        <a th:href="@{'/category/' + 'STUDENT_UNIFORM'}">เครื่องแบบนักศึกษา</a>
                        <a th:href="@{'/category/' + 'GENERAL_PURPOSE'}">ของใช้ทั่วไป</a>
                        <a th:href="@{'/category/' + 'MEMORABILIA'}">ของที่ระลึก</a>

                    </div>
                </li>

                <li><a th:href="@{/login}">เช็คสถานะ</a></li>
                <li><a th:href="@{/}">ติดต่อเรา</a></li>
                <li><a href="#" id="search-icon"><i class="fa-solid fa-magnifying-glass"></i></a></li>
            </ul>
            <div class="search-bar-replacement">
  <div class="search-input-container">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="text" id="search-input" placeholder="ค้นหาสินค้าที่คุณต้องการ...">
    <div id="search-suggestions" class="suggestions-list"></div>
  </div>

  <button class="search-close-btn" id="search-close">
    <i class="fa-solid fa-xmark"></i>
  </button>

  <button id="filter-icon" class="search-filter-btn">
     <i class="fa-solid fa-filter"> ตัวกรอง</i>
  </button>
  </div>

        </nav>

    <div class="product-section">
        <div class="product-header">
            <h1 id="page-title">รายการสินค้าทั้งหมด</h1>
        </div>

        <br>
        <div class="product-grid">
            <a th:each="product : ${products}" 
                th:href="@{'/product_detail/' + ${product.productId}}" 
                class="product-card-link">
                <div class="product-card">
                    <div class="product-image">
                        <img th:if="${product.main_image != null}" th:src="@{/product_img/{file}(file=${product.main_image})}" alt="Product Image">
                    </div>
                    <div class="product-info">
                        <span class="product-name" th:text="${product.name}">Product Name</span>
                        <span class="product-price" th:text="'฿ ' + ${product.price}">฿ 0.0</span>
                    </div> 
                </div>
            </a>
        </div>
    </div>
    <!-- ======= Popup Logout ======= -->
    <div class="logout-modal" id="logout-modal">
        <div class="modal-content">
            <i class="fa-solid fa-circle-exclamation"></i>
            <p>คุณต้องการออกจากระบบหรือไม่</p>
            <div class="modal-buttons">
                <button id="cancel-logout" class="cancel-btn">ยกเลิก</button>
                <button id="confirm-logout" class="confirm-btn">ยืนยัน</button>
            </div>
            <i class="fa-solid fa-xmark modal-close" id="close-modal"></i>
        </div>
    </div>

    <div class="logout-success" id="logout-success">
        <div class="success-content">
            <i class="fa-solid fa-circle-check"></i>
            <p>ออกจากระบบสำเร็จแล้ว</p>
        </div>
    </div>
    <script th:src="@{/js/main.js}" defer></script>
    <script>
        // element h1 ที่เราจะเปลี่ยนข้อความ
        const titleEl = document.getElementById('page-title');

        // เอา path ปัจจุบัน เช่น /category/SHIRT
        const path = window.location.pathname;

        // ถ้าเป็นหน้า category/*
        if (path.startsWith('/category/')) {
            const code = path.split('/').pop();   // ได้ code เช่น SHIRT

            // map code → ชื่อภาษาไทย
            const categoryMap = {
            'SHIRT': 'เสื้อ',
            'BAG': 'กระเป๋า',
            'STUDENT_UNIFORM': 'เครื่องแบบนักศึกษา',
            'GENERAL_PURPOSE': 'ของใช้ทั่วไป',
            'MEMORABILIA': 'ของที่ระลึก'
            };

            if (categoryMap[code]) {
            titleEl.textContent = categoryMap[code];   // เช่น "เสื้อ"
            } else {
            titleEl.textContent = 'รายการสินค้าทั้งหมด';
            }

        } else {
            // กรณีอื่น ๆ เช่น /index หรือ /product_no_login
            titleEl.textContent = 'รายการสินค้าทั้งหมด';
        }
    </script>
    <script>
  // Dropdown หมวดหมู่สินค้า//
  document.addEventListener("DOMContentLoaded", function() {
    const dropdownToggle = document.querySelector('.dropdown-toggle');
    const dropdownContent = document.querySelector('.dropdown-content');
    const overlay = document.querySelector('.overlay');

    dropdownToggle.addEventListener('click', function(e) {
      e.preventDefault();
      dropdownContent.classList.toggle('show');
      overlay.classList.toggle('show');
    });

    overlay.addEventListener('click', function() {
      dropdownContent.classList.remove('show');
      overlay.classList.remove('show');
    });
  });
</script>                              
<script th:src="@{/js/main.js}" defer></script>
<script th:src="@{/js/search.js}" defer></script>

</body>
</html>
