<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <title>Review Order - TU Store</title>

  <!-- CSS -->
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/order-status.css">
  <link rel="stylesheet" href="/css/order-detail.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>

<body>
  <!-- navbar -->
  <nav class="nav-top"></nav>
  <div class="left-logo"></div>
  <nav class="nav-bottom"></nav>

  <h1 class="page-title">เขียนรีวิวสินค้า</h1>

  <section class="order-detail-card">

    <!-- ชื่อร้าน -->
    <div class="shop-row">
      <span class="shop-icon material-symbols-outlined">storefront</span>
      <span class="shop-name">กำลังโหลด...</span>
    </div>

    <div class="summary-grid">
      <!-- รูปสินค้า -->
      <div class="thumb">
        <img class="product-image" src="" alt="Product"/>
      </div>

      <div class="summary-content">
        <!-- ชื่อสินค้า -->
        <div class="detail-item">
          <span class="detail-label">ชื่อสินค้า</span>
          <span class="detail-value product-name">กำลังโหลด...</span>
        </div>

        <!-- ขนาด/สี/จำนวน -->
        <div class="detail-item">
          <span class="detail-label">รายละเอียด</span>
          <span class="detail-value detail-info">กำลังโหลด...</span>
        </div>

        <!-- ราคา -->
        <div class="detail-item">
          <span class="detail-label">ราคา</span>
          <span class="detail-value detail-price">กำลังโหลด...</span>
        </div>
      </div>
    </div>

    <hr class="detail-divider">

    <!-- แบบฟอร์มรีวิว -->
    <form class="review-form-container"
      action="/api/review"
      method="POST"
      enctype="multipart/form-data">

    <input type="hidden" id="orderIdInput" name="orderId" />
<input type="hidden" id="productIdInput" name="productId" />


      <!-- คะแนน -->
      <div class="review-section">
        <label class="review-label">ให้คะแนนสินค้านี้</label>
        <div class="star-rating-input">
          <i class="fa-regular fa-star star-btn" data-value="1"></i>
          <i class="fa-regular fa-star star-btn" data-value="2"></i>
          <i class="fa-regular fa-star star-btn" data-value="3"></i>
          <i class="fa-regular fa-star star-btn" data-value="4"></i>
          <i class="fa-regular fa-star star-btn" data-value="5"></i>
          <input type="hidden" id="rating-value" name="rating" value="0" required>
        </div>
      </div>

      <!-- ความคิดเห็น -->
      <div class="review-section">
        <label class="review-label">ความคิดเห็น</label>
        <textarea class="review-textarea" name="comment" rows="5"
                  placeholder="บอกเล่าประสบการณ์การใช้งานสินค้า..."></textarea>
      </div>

      <!-- อัปโหลดรูป -->
      <div class="review-section">
        <label class="review-label">เพิ่มรูปภาพสินค้า</label>
        <div class="image-upload-grid" id="image-upload-grid">
          <div class="upload-box" onclick="document.getElementById('review-img-input').click()">
            <i class="fa-solid fa-plus"></i>
            <span>เพิ่มรูป</span>
            <input type="file" id="review-img-input" name="images" accept="image/*"
                   multiple hidden onchange="handleImageUpload(this)">
          </div>
        </div>
      </div>

      <!-- ปุ่ม -->
      <div class="review-actions">
        <button type="button" class="btn-cancel" onclick="history.back()">ยกเลิก</button>
        <button type="submit" class="btn-confirm">ยืนยันรีวิว</button>
      </div>
    </form>

  </section>

  <!-- main.js -->
  <script src="/js/main.js" defer></script>

 <script>
/* ============================================================
   โหลดข้อมูล order + product จาก API แล้วเติมลงหน้า
   ============================================================ */
document.addEventListener("DOMContentLoaded", async () => {

  const params = new URLSearchParams(window.location.search);
  const orderId = params.get("orderId");
  const productId = params.get("productId");

  if (!orderId || !productId) {
      console.error("Missing orderId or productId");
      return;
  }

  try {
      // Load order
      const orderRes = await fetch(`/api/orders/${orderId}`);
      const order = await orderRes.json();

      // Load product
      const productRes = await fetch(`/api/products/${productId}`);
      const product = await productRes.json();

      // ----- Fill UI -----
      document.querySelector(".shop-name").textContent =
          order.shopName ?? "ไม่พบข้อมูลร้านค้า";

      document.querySelector(".product-image").src =
          `/product_img/${order.imagePath}`;

      document.querySelector(".product-name").textContent = product.name;

      document.querySelector(".detail-info").textContent =
          `ขนาด (${order.size}), สี (${order.color}) × ${order.quantity}`;

      document.querySelector(".detail-price").textContent =
          `฿${order.totalPrice}`;

      // ----- hidden input (สำหรับ submit form) -----
      document.getElementById("orderIdInput").value = order.orderId;
      document.getElementById("productIdInput").value = product.productId;

  } catch (err) {
      console.error("โหลดข้อมูลรีวิวล้มเหลว:", err);
  }
});


/* ============================================================
   ระบบกดดาว (Star Rating)
   ============================================================ */
document.addEventListener("DOMContentLoaded", () => {
  const stars = document.querySelectorAll(".star-btn");
  const ratingInput = document.getElementById("rating-value");

  function updateStars(value) {
      stars.forEach((star, index) => {
          if (index < value) {
            star.classList.remove("fa-regular");
            star.classList.add("fa-solid", "active");
          } else {
            star.classList.remove("fa-solid", "active");
            star.classList.add("fa-regular");
          }
      });
  }

  stars.forEach((star, index) => {
      // hover
      star.addEventListener("mouseover", () => updateStars(index + 1));

      // mouse out
      star.addEventListener("mouseout", () => updateStars(ratingInput.value));

      // click
      star.addEventListener("click", () => {
          ratingInput.value = index + 1;
          updateStars(index + 1);
      });
  });
});


/* ============================================================
   ระบบ Upload + Preview รูปภาพ
   ============================================================ */
function handleImageUpload(input) {
    const grid = document.getElementById("image-upload-grid");
    const uploadBox = grid.querySelector(".upload-box");

    Array.from(input.files).forEach(file => {
        if (!file.type.startsWith("image/")) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            const imgBox = document.createElement("div");
            imgBox.classList.add("preview-img-box");
            imgBox.innerHTML = `
                <img src="${e.target.result}" alt="preview">
                <div class="remove-btn" onclick="this.parentElement.remove()">
                    <i class="fa-solid fa-xmark"></i>
                </div>
            `;
            grid.insertBefore(imgBox, uploadBox);
        };
        reader.readAsDataURL(file);
    });

    // reset เพื่อให้เลือกไฟล์ซ้ำได้
    input.value = "";
}
</script>


</body>
</html>
