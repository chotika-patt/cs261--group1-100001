<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>

    <!-- ใช้ th:href ให้ dynamic -->
    <link rel="icon" type="image/png" href="/img/Logo.png">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
    <link th:href="@{/css/login-regis.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
<div class="login-page">
    <div class="login-container">
        <div class="login-box">
            <!-- ปุ่มออก -->
            <a th:href="@{/}" class="exit-btn close-login">
                <i class="fa-solid fa-x"></i>
            </a>

            <h1>เปลี่ยนรหัสผ่านใหม่</h1>

            <!-- ฟอร์มเข้าสู่ระบบ -->
            <form th:action="@{/login}" method="post">
                <label class="login-label" for="username">รหัสผ่าน</label>
                <input type="text" id="username" name="username" class="login-input" placeholder="ใส่รหัสผ่านของคุณ" required>

                <label class="login-label" for="password">รหัสผ่าน</label>
                <input type="password" id="password" name="password" class="login-input" placeholder="ยืนยันรหัสผ่าน" required>

                <button class="login-submit-btn" type="submit" id="subBtn">ยืนยันการเปลี่ยนรหัสผ่าน</button><br>
                <a class="regis" th:href="@{/register.html}">กลับสู่หน้าหลัก</a>
            </form>
        </div>
    </div>
</div>

<!-- สคริปต์ -->
<script th:src="@{/js/auth.js}"></script>
</body>
</html>
