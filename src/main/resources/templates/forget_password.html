<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เปลี่ยนรหัสผ่านใหม่</title>

    <link rel="icon" type="image/png" href="/img/Logo.png">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
    <link th:href="@{/css/login-regis.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="login-page">
    <div class="login-container">
        <div class="login-box">
            <!-- ปุ่มออก -->
            <a th:href="@{/}" class="exit-btn close-login">
                <i class="fa-solid fa-x"></i>
            </a>

            <h1>เปลี่ยนรหัสผ่านใหม่</h1>

            <!-- ฟอร์มเปลี่ยนรหัสผ่าน -->
            <form id="changePwForm">
                <label class="login-label" for="newPassword">รหัสผ่านใหม่ *</label>
                <input type="password" id="newPassword" name="newPassword" class="login-input" placeholder="ใส่รหัสผ่านของคุณ" required>

                <label class="login-label" for="confirmPassword">ยืนยันรหัสผ่านใหม่ *</label>
                <input type="password" id="confirmPassword" name="confirmPassword" class="login-input" placeholder="ยืนยันรหัสผ่าน" required>

                <button class="login-submit-btn" style="font-size:14px" type="submit" id="confirmChange">
                    ยืนยันการเปลี่ยนรหัสผ่าน
                </button><br>
                <a class="regis" th:href="@{/login}">กลับสู่หน้าหลัก</a>
            </form>
        </div>
    </div>
</div>

<!-- overlay ตอนกดยืนยันเปลี่ยนรหัส-->
<div id="pw-modal" class="overlay-modal">
    <div class="modal-box" id="pw-modal-box">
        <i class="fa-solid fa-circle-check" id="pw-icon"></i>
        <h2 id="pw-message">ข้อความสถานะ</h2>
        <a href="/login" class="modal-btn" id="pw-button">กลับเข้าสู่ระบบอีกครั้ง</a>
    </div>
</div>




<script th:src="@{/js/auth.js}"></script>
<script>
    // ปุ่ม submit
    document.getElementById("changePwForm").addEventListener("submit", (e) => {
      e.preventDefault();

      const newPw = document.getElementById("newPassword").value.trim();
      const confirmPw = document.getElementById("confirmPassword").value.trim();

      const modal = document.getElementById("pw-modal");
      const icon = document.getElementById("pw-icon");
      const msg = document.getElementById("pw-message");
      const btn = document.getElementById("pw-button");
      const box = document.getElementById("pw-modal-box");

      // ตรวจสอบเงื่อนไขรหัสผ่าน
      if (!newPw || !confirmPw) {
        icon.className = "fa-solid fa-circle-exclamation error";
        msg.textContent = "กรุณากรอกรหัสผ่านให้ครบ";
        btn.textContent = "ตกลง";
        btn.href = "#";
        modal.classList.add("active");
        return;
      }

      if (newPw !== confirmPw) {
        icon.className = "fa-solid fa-circle-xmark error";
        msg.textContent = "เปลี่ยนรหัสผ่านไม่สำเร็จ";
        btn.textContent = "กลับเข้าสู่ระบบอีกครั้ง";
        btn.href = "#";
        modal.classList.add("active");
        return;
      }

      // ถ้าสำเร็จ
      icon.className = "fa-solid fa-circle-check success";
      msg.textContent = "เปลี่ยนรหัสผ่านเสร็จสิ้น";
      btn.textContent = "กลับเข้าสู่ระบบอีกครั้ง";
      btn.href = "/login";
      modal.classList.add("active");
    });

    // ปิด modal เมื่อกดตกลงใน error case
    document.getElementById("pw-button").addEventListener("click", (e) => {
      if (e.target.href.endsWith("#")) {
        e.preventDefault();
        document.getElementById("pw-modal").classList.remove("active");
      }
    });
</script>

</body>

</html>
